name: Comportamiento incompatible
description: Registra una diferencia reproducible entre el contrato y el resultado en Linux.
title: "[Compat] "
body:
  - type: textarea
    id: case
    attributes:
      label: Reproductor mínimo
      description: Indica código fuente o pasos, interfaz, entradas y salidas. Usa datos sintéticos.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Contrato esperado
      description: Enlaza el contrato público e indica NTSTATUS, salidas y efectos esperados.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Resultado del backend
      description: Incluye commit, distribución, kernel, arquitectura y backend probado en Linux.
    validations:
      required: true
