name: Tarea técnica
description: Propón un cambio acotado con criterios verificables.
title: "[Tarea] "
body:
  - type: textarea
    id: scope
    attributes:
      label: Alcance y motivo
      description: Enlaza la decisión o entrada del backlog afectada.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Indica pruebas, fuentes y riesgos específicos del cambio.
    validations:
      required: true
