name: Mouth LAN (Bones ModKit)
on:
  push:
    paths:
      - "Mouth/**"
      - "BONES/**"
      - ".github/workflows/mouth-lan.yml"
  pull_request:
    paths:
      - "Mouth/**"
      - "BONES/**"
      - ".github/workflows/mouth-lan.yml"
  workflow_dispatch:
jobs:
  linux-gcc-lan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check codec
        run: make -C Mouth test
      - name: Two-process Bones UDP loopback
        run: make -C Mouth loopback
      - name: Bones official ModKit regression
        run: make -C BONES modkit_test
      - name: Build installable source ZIP
        run: python3 Mouth/scripts/sync_bones_module.py --pack
      - name: Upload Mouth ModKit source package
        uses: actions/upload-artifact@v4
        with:
          name: Mouth_Bones_ModKit_0_4_Source
          path: Mouth/build/MOUTH_Bones_ModKit_0_4.zip
          if-no-files-found: error
  windows-msvc-lan:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build MSVC and codec regression
        shell: cmd
        run: |
          call Mouth\scripts\ci_windows_msvc.bat
      - name: Windows two-process UDP loopback
        shell: pwsh
        run: python Mouth/tests/test_loopback.py Mouth/build/mouth_lan_demo.exe
      - name: Windows session errors and disconnect
        shell: pwsh
        run: python Mouth/tests/test_session_network.py Mouth/build/mouth_lan_demo.exe

