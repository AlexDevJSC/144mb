name: Mouth LAN (Bones ModKit)
on:
  push:
    paths:
      - "Mouth/**"
      - "BONES/**"
      - ".github/workflows/mouth-lan.yml"
  pull_request:
    paths:
      - "Mouth/**"
      - "BONES/**"
      - ".github/workflows/mouth-lan.yml"
  workflow_dispatch:
jobs:
  linux-gcc-lan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check codec
        run: make -C Mouth test
      - name: Two-process Bones UDP loopback
        run: make -C Mouth loopback
  windows-msvc-lan:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build MSVC and codec regression
        shell: cmd
        run: |
          call Mouth\scripts\ci_windows_msvc.bat
      - name: Windows two-process UDP loopback
        shell: pwsh
        run: python Mouth/tests/test_loopback.py Mouth/build/mouth_lan_demo.exe

