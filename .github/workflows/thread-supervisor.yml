name: Experimental thread supervisor
on:
  push:
    paths:
      - 'src/supervisor/**'
      - 'src/runtime/thread_broker_*.c'
      - 'src/runtime/thread_broker_*.h'
      - 'src/runtime/process.c'
      - 'src/runtime/compat.h'
      - 'src/tools/pe_isolated_run.c'
      - 'tests/supervisor_authenticated_ipc_test.c'
      - 'tests/runtime_supervisor_launch_test.c'
      - 'tests/thread_supervisor_test.c'
      - 'tests/pe/supervisor_pe_*.c'
      - 'tests/pe/supervisor_pe_shared.h'
      - 'scripts/check-thread-supervisor.sh'
      - 'scripts/fedora-thread-supervisor-acceptance.sh'
      - 'scripts/check-pe-thread-supervisor-bwrap.sh'
      - 'include/ntnative/guest_boundary.h'
      - 'Makefile'
      - 'src/pe/image.c'
      - 'src/runtime/guest_thread.c'
      - 'src/runtime/guest_boundary.c'
      - 'src/runtime/guest_boundary_import.S'
      - 'src/runtime/exports.c'
      - 'src/runtime/threads.c'
      - 'include/ntnative/guest_boundary_runtime.h'
      - 'tests/guest_boundary_import_test.c'
      - 'tests/supervisor_control_ipc_test.c'
      - 'tests/supervisor_context_rollback_fault_test.c'
      - 'tests/thread_broker_transport_failure_test.c'
      - 'src/pe/dll_graph.c'
      - 'src/pe/dll_graph.h'
      - 'tests/pe/async_supervisor_fixture.c'
      - 'tests/pe/async_supervisor_host.c'
      - 'scripts/check-core4-manual-hardening.sh'
      - 'src/runtime/thread_supervisor_control_server.c'
      - 'src/runtime/thread_supervisor_control_server.h'
      - 'src/supervisor/nt_supervisor_nt_bridge.c'
      - 'src/supervisor/nt_supervisor_nt_bridge.h'
      - 'src/runtime/thread_broker_ipc.h'
      - '.github/workflows/thread-supervisor.yml'
  pull_request:
    paths:
      - 'src/supervisor/**'
      - 'src/runtime/thread_broker_*.c'
      - 'src/runtime/thread_broker_*.h'
      - 'src/runtime/process.c'
      - 'src/runtime/compat.h'
      - 'src/tools/pe_isolated_run.c'
      - 'tests/supervisor_authenticated_ipc_test.c'
      - 'tests/runtime_supervisor_launch_test.c'
      - 'tests/thread_supervisor_test.c'
      - 'tests/pe/supervisor_pe_*.c'
      - 'tests/pe/supervisor_pe_shared.h'
      - 'scripts/check-thread-supervisor.sh'
      - 'scripts/fedora-thread-supervisor-acceptance.sh'
      - 'scripts/check-pe-thread-supervisor-bwrap.sh'
      - 'include/ntnative/guest_boundary.h'
      - 'Makefile'
      - 'src/pe/image.c'
      - 'src/runtime/guest_thread.c'
      - 'src/runtime/guest_boundary.c'
      - 'src/runtime/guest_boundary_import.S'
      - 'src/runtime/exports.c'
      - 'src/runtime/threads.c'
      - 'include/ntnative/guest_boundary_runtime.h'
      - 'tests/guest_boundary_import_test.c'
      - 'tests/supervisor_control_ipc_test.c'
      - 'tests/supervisor_context_rollback_fault_test.c'
      - 'tests/thread_broker_transport_failure_test.c'
      - 'src/pe/dll_graph.c'
      - 'src/pe/dll_graph.h'
      - 'tests/pe/async_supervisor_fixture.c'
      - 'tests/pe/async_supervisor_host.c'
      - 'scripts/check-core4-manual-hardening.sh'
      - 'src/runtime/thread_supervisor_control_server.c'
      - 'src/runtime/thread_supervisor_control_server.h'
      - 'src/supervisor/nt_supervisor_nt_bridge.c'
      - 'src/supervisor/nt_supervisor_nt_bridge.h'
      - 'src/runtime/thread_broker_ipc.h'
      - '.github/workflows/thread-supervisor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify native PE32+ link tooling
        run: |
          cc --version | head -1
          ld -V | grep -F i386pep
          objcopy --version | head -1
      - name: Verify Win64 import ABI and host lock gate
        run: make check-guest-boundary
      - name: Repeat Win64 guest/host import ABI with UBSan
        run: |
          make BUILD_DIR=build-guest-boundary-ubsan \
            CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            check-guest-boundary
      - name: Reject delayed and malformed authenticated IPC replies
        run: make -j2 check-broker-transport-failure
      - name: Prove authenticated suspend, context and signal lifecycle
        run: make -j2 check-supervisor-control-ipc
      - name: Verify CONTEXT GPR readback, rollback and pidfd-only fatal recovery
        run: make -j2 check-supervisor-context-rollback
      - name: Repeat supervisor control lifecycle with UBSan
        run: |
          make -j2 BUILD_DIR=build-supervisor-control-ubsan \
            CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            check-supervisor-control-ipc
      - name: Prove authenticated runtime/parent supervisor IPC and generation revocation
        run: make -j2 check-supervisor-authenticated-ipc
      - name: Repeat authenticated supervisor IPC test with UBSan
        run: |
          make -j2 BUILD_DIR=build-supervisor-ipc-ubsan \
            CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            check-supervisor-authenticated-ipc
      - name: Prove independent asynchronous stop and register roundtrip
        run: make check-thread-supervisor
      - name: Repeat with undefined-behavior sanitizer
        run: |
          BUILD_DIR=build-supervisor-ubsan \
          CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            make check-thread-supervisor
      - name: Prove real mapped PE32+ guest RIP and GS/TEB, not a Linux-only surrogate
        run: make -j2 check-pe-thread-supervisor
      - name: Fail closed on PE APC callback completion mismatch
        run: make -j2 check-pe-thread-supervisor-apc-failure
      - name: Fail closed on final APC XSTATE restoration mismatch
        run: make -j2 check-pe-thread-supervisor-apc-xstate-failure
      - name: Cancel and disconnect APC safely, reject signals and PE faults
        run: make -j2 check-pe-thread-supervisor-apc-guards
      - name: Run controlled PE and supervisor together inside Bubblewrap if host permits
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap
          set +e
          bash scripts/check-pe-thread-supervisor-bwrap.sh
          rc=$?
          set -e
          if [ "$rc" -eq 77 ]; then
            echo 'INCOMPLETE Bubblewrap user namespaces or ptrace denied by hosted runner; not physical Fedora acceptance'
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Repeat PE supervisor integration with UBSan
        run: |
          make -j2 BUILD_DIR=build-supervisor-pe-ubsan \
            CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            check-pe-thread-supervisor
