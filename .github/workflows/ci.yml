name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build, test Linux and execute the PE fixture
        run: make -j2 check check-pe
      - name: Undefined behavior sanitizer
        run: >-
          make -j2 BUILD_DIR=build-ubsan
          CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all'
          check check-pe

  fedora-rpm:
    runs-on: ubuntu-24.04
    container: quay.io/fedora/fedora:45
    timeout-minutes: 15
    steps:
      - name: Install Fedora build tools in the CI container
        run: dnf -y install git gcc binutils make redhat-rpm-config rpm-build tar gzip
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build RPM and run its check section
        run: |
          rpm_topdir="$PWD/build-rpm"
          mkdir -p "$rpm_topdir/SOURCES"
          git -c safe.directory="$PWD" archive --format=tar.gz --prefix=nt-native-linux-0.1.0/ HEAD \
            > "$rpm_topdir/SOURCES/nt-native-linux-0.1.0.tar.gz"
          rpmbuild --define "_topdir $rpm_topdir" -ba packaging/fedora/nt-native-linux.spec
          rpm -qpl "$rpm_topdir"/RPMS/x86_64/nt-native-linux-0.1.0-*.rpm > "$rpm_topdir/payload.txt"
          cat "$rpm_topdir/payload.txt"
          grep -Fx /usr/bin/nt-native-probe "$rpm_topdir/payload.txt"
