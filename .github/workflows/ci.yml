name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the AMD64 Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix
          x86_64-w64-mingw32-gcc --version
      - name: Build, test Linux and execute the PE fixture
        run: make -j2 check check-pe check-pe-import
      - name: Undefined behavior sanitizer
        run: >-
          make -j2 BUILD_DIR=build-ubsan
          CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all'
          check check-pe check-pe-import
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pe-counter-import
          path: build/nt-counter-import.exe
          if-no-files-found: error
          retention-days: 7

  windows-reference:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and query the host ntdll.dll
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C toolchain not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $compile = 'call "{0}" && cl /nologo /std:c17 /W4 /WX /O2 tests\windows\qpc_reference.c /Fe:qpc-reference.exe' -f $vcvars
          cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\qpc-reference.exe
          exit $LASTEXITCODE

  windows-import:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pe-counter-import
          path: pe-import
      - name: Run the same PE import fixture with Windows ntdll.dll
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'pe-import\nt-counter-import.exe'
          $process = Start-Process -FilePath $fixture -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "PE import fixture failed with exit code $($process.ExitCode)"
          }
          Write-Host "PASS PE import fixture on $([Environment]::OSVersion.VersionString) (3 cases)"

  fedora-rpm:
    runs-on: ubuntu-24.04
    container: quay.io/fedora/fedora:45
    timeout-minutes: 15
    steps:
      - name: Install Fedora build tools in the CI container
        run: dnf -y install git gcc binutils make redhat-rpm-config rpm-build tar gzip
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build RPM and run its check section
        run: |
          rpm_topdir="$PWD/build-rpm"
          mkdir -p "$rpm_topdir/SOURCES"
          git -c safe.directory="$PWD" archive --format=tar.gz --prefix=nt-native-linux-0.1.0/ HEAD \
            > "$rpm_topdir/SOURCES/nt-native-linux-0.1.0.tar.gz"
          rpmbuild --define "_topdir $rpm_topdir" -ba packaging/fedora/nt-native-linux.spec
          rpm -qpl "$rpm_topdir"/RPMS/x86_64/nt-native-linux-0.1.0-*.rpm > "$rpm_topdir/payload.txt"
          cat "$rpm_topdir/payload.txt"
          grep -Fx /usr/bin/nt-native-probe "$rpm_topdir/payload.txt"
