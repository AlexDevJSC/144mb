name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  filesystem4-linux:
    # Independent FS4 regression gate: unrelated PE/APC/graphics failures must
    # not hide this subsystem's evidence. No physical FUSE/SELinux claim.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install FileSystem4 build and test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 --no-install-recommends install -y gcc-mingw-w64-x86-64-posix libsdl2-dev libsdl2-image-dev libcairo2-dev libffi-dev libssl-dev libicu-dev libfuse3-dev fuse3 libfluidsynth3 libvkd3d-dev libvulkan-dev mesa-vulkan-drivers bubblewrap fonts-dejavu-core
      - name: Verify FileSystem4 targets without changing host security
        run: |
          set -o pipefail
          make -j2 \
            check-fs4-handle-broker check-fs4-ntfs-diff \
            check-fs4-reparse-wal check-fs4-storage-service \
            check-fs4-readonly-session check-fs4-service-supervisor \
            check-fs4-acceptance-gates check-fs4-fuse-staging-sigkill \
            check-fs-backing-audit check-fs-supervisor \
            check-dos83-mediator check-dos83-fuse check-dos83-wal \
            check-dos83-sigkill check-dos83-alias-durability \
            check-dos83-wal-io-failure check-dos83-pending-delete-durability \
            check-dos83-namespace-durability check-dos83-pending-wal-admission \
            check-dos83-all-grants check-dos83-bad-source check-nt-acl-engine \
            2>&1 | tee fs4-linux-regression.log
          if grep -Eiq 'SKIP.*(mounted.FUSE|FUSE|Landlock|Bubblewrap|sandbox|large junction)' fs4-linux-regression.log; then
            echo '::warning::INCOMPLETE: FS4 physical isolation/mounted FUSE checks skipped on this CI runner; Fedora acceptance remains pending'
          fi
      - name: Preserve FileSystem4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem4-regressions-${{ github.sha }}
          path: fs4-linux-regression.log
          if-no-files-found: warn
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check stage-4 Fedora acceptance script syntax
        run: |
          bash -n scripts/fedora-check-stage4.sh scripts/fedora-stage4-multigroup-acceptance.sh scripts/fedora-p2-3-acceptance.sh scripts/fedora-qa-environment.sh scripts/dos83-fuse-confined.sh
          bash scripts/fedora-qa-environment.sh --help >/dev/null
          python3 -m py_compile scripts/compare-stage4-scheduler.py scripts/compare-stage4-quantum.py scripts/compare-stage4-fp-context.py scripts/analyze-fedora-qa.py
          python3 -m unittest discover -s tests -p 'test_compare_stage4_quantum.py'
          python3 -m unittest discover -s tests -p 'test_compare_stage4_fp_context.py'
          python3 -m unittest discover -s tests -p 'test_fedora_qa_report.py'
      - name: Install Linux build and desktop test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 --no-install-recommends install -y gcc-mingw-w64-x86-64-posix libsdl2-dev libsdl2-image-dev libcairo2-dev libffi-dev libssl-dev libicu-dev libfuse3-dev fuse3 libfluidsynth3 libvkd3d-dev libvulkan-dev mesa-vulkan-drivers bubblewrap weston fonts-dejavu-core
          x86_64-w64-mingw32-gcc --version
      - name: NT144 QA P0 direct import audit and free-standing fixture support
        run: make -j2 check-pe-preflight check-pe-lstrcmp check-fixture-memory
      - name: NT144 QA MinGW16 link, exact graphics import names and execution
        run: |
          make -j2 check-pe-displayconfig check-pe-native check-pe-graphics-import-names
      - name: NT144 QA scroll/menu and Raw Input regression offscreen
        run: SDL_VIDEODRIVER=offscreen SDL_FRAMEBUFFER_ACCELERATION=0 make -j2 check-desktop
      # Bubblewrap might be forbidden on hosted Ubuntu. Run the full
      # fixture; explicitly flag namespace skips, never call them PASS.
      - name: NT144 QA child PE inside Bubblewrap if namespaces are permitted
        run: |
          set -o pipefail
          SDL_VIDEODRIVER=offscreen SDL_FRAMEBUFFER_ACCELERATION=0 make -j2 check-pe-isolated 2>&1 | tee nt144-isolated.log
          if grep -q '^SKIP external-PE sandbox test:' nt144-isolated.log; then
            echo '::notice::INCOMPLETE: GitHub runner cannot execute nested PE under Bubblewrap; Fedora physical gate still required'
          else
            grep -F 'PASS PE child launched inside the same Linux sandbox and returned its full exit code' nt144-isolated.log
            grep -F 'PASS PE launcher preserves Windows arguments, escaping and Unicode' nt144-isolated.log
          fi
      # Check our real kernel-signal-to-PE SEH contract independently of
      # preexisting APC/VEH regressions, so a failing legacy test cannot
      # hide its actual result.
      - name: Prove special APC delivery during import-free Win64 PE busy loop
        run: make -j2 check-pe-async-special-apc
      - name: Prove frame-based Win64 SEH recovery inside a remotely delivered special APC
        run: make -j2 check-pe-async-special-apc-seh
      - name: Prove genuine CPU faults recover in a Win64 PE SEH frame
        run: make -j2 check-pe-hardware-seh
      # CI should fail at the REAL PE regression instead of compiling
      # unrelated FUSE/desktop projects for several minutes first.
      - name: Prove special APC and frame-based VEH/SEH PE before full suite
        run: make -j2 check-pe-apc check-pe-seh
      - name: Build, test Linux and execute the PE fixture
        run: make -j2 all check check-pe check-pe-import check-pe-image
      - name: Record Linux-hosted NT/Win32 context observation
        run: |
          set -o pipefail
          mkdir -p build
          make -j2 check-runtime-supervisor-win32 2>&1 | tee build/stage4-linux-context.log
          grep -F 'PASS real runtime Win32 entrypoints:' build/stage4-linux-context.log
      - name: Require native FluidSynth library and ABI
        run: make check-audio-required

      - name: Compile FUSE mediation backend and verify fail-closed static tests
        run: make check-dos83-fuse

      - name: Positive reversible process priority class on multiple guest TIDs
        run: |
          # This changes only nice/RLIMIT_NICE in the disposable test process.
          # No host service, SELinux policy or foreign thread is touched.
          command -v prlimit
          sudo prlimit --nice=40:40 -- env NT_REQUIRE_POSITIVE_MULTITHREAD_PRIORITY=1 \
            ./build/process-priority-multithread-test
      - name: Real bounded wake boost and automatic decay with reversible nice
        run: |
          # Permission only for this disposable guest process; no host TIDs.
          sudo prlimit --nice=40:40 -- env NT_NATIVE_EXPERIMENTAL_BOOST=1 \
            NT_REQUIRE_POSITIVE_BOOST=1 ./build/dynamic-priority-boost-test
      - name: Prove reversible nonroot priority transitions with delegated RLIMIT_NICE
        run: |
          # Raise only the disposable test's resource limit, then drop
          # privileges before running any code from this checkout.
          sudo prlimit --nice=40:40 -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --             env NT_REQUIRE_POSITIVE_MULTITHREAD_PRIORITY=1 ./build/process-priority-multithread-test
          sudo prlimit --nice=40:40 -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --             env NT_NATIVE_EXPERIMENTAL_BOOST=1 NT_REQUIRE_POSITIVE_BOOST=1 ./build/dynamic-priority-boost-test
      - name: Observe one-CPU scheduler fairness and first-run latency on Linux
        run: make check-stage4-quantum
      - name: Preserve Linux quantum observation (not NT parity)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-linux-host-${{ github.sha }}
          path: |
            build/stage4-linux-quantum.txt
            build/stage4-linux-context.log
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose native Vulkan without claiming D3D12 compatibility
        run: build/nt-vulkan-probe
      - name: Paint and close a PE fixture under Wayland
        run: sh tests/pe/run_wayland.sh make -j2 check-desktop
      - name: Exercise window messages and clipboard offscreen
        run: SDL_VIDEODRIVER=offscreen SDL_FRAMEBUFFER_ACCELERATION=0 make -j2 check-desktop
      - name: Map and execute trusted external desktop PE on Linux
        run: make check-pe-lstrcmp check-pe-external check-pe-native check-pe-kernel-user check-pe-nt-io check-pe-core-objects check-pe-apc check-pe-dll-graph check-pe-memory check-pe-native-core check-pe-named-events check-pe-veh check-pe-suspended-thread check-pe-async-supervisor check-pe-thread-groups check-pe-priority-class check-pe-priority-boost check-pe-process-affinity check-pe-teb-tls
      - name: Execute Win32 display topology fixture on Linux
        run: make check-pe-displayconfig
      - name: Execute native Win32 console PE fixture on Linux
        run: make check-pe-console
      - name: Exercise native graphics, WIC, shell and software exceptions
        run: |
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          VK_DRIVER_FILES="$icd" make -j2 check-pe-graphics check-pe-wic check-pe-platform check-pe-seh
      - name: Run external PE with native Linux isolation if namespaces permit
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_FRAMEBUFFER_ACCELERATION: "0"
        run: make check-pe-isolated
      - name: Undefined behavior sanitizer
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_FRAMEBUFFER_ACCELERATION: "0"
        run: |
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          make -j2 BUILD_DIR=build-ubsan \
          CFLAGS='-O1 -g -fsanitize=undefined -fno-sanitize-recover=all' \
            check check-pe check-pe-import check-pe-image check-desktop check-pe-native check-pe-displayconfig \
            check-pe-console check-pe-graphics check-pe-wic check-pe-platform check-pe-seh check-pe-kernel-user check-pe-nt-io check-pe-core-objects check-pe-apc check-pe-dll-graph check-pe-memory check-pe-native-core check-pe-named-events check-pe-veh check-pe-suspended-thread check-pe-async-supervisor check-pe-thread-groups check-pe-priority-class check-pe-priority-boost check-pe-process-affinity check-pe-teb-tls

  fedora-rpm:
    runs-on: ubuntu-24.04
    container: quay.io/fedora/fedora:45
    timeout-minutes: 15
    steps:
      - name: Install Fedora build tools in the CI container
        run: dnf -y install git gcc binutils make redhat-rpm-config rpm-build tar gzip /usr/bin/curl /usr/bin/sha256sum 'pkgconfig(sdl2)' 'pkgconfig(SDL2_image)' 'pkgconfig(cairo)' 'pkgconfig(libffi)' 'pkgconfig(libcrypto)' 'pkgconfig(icu-uc)' 'pkgconfig(fuse3)' 'pkgconfig(libvkd3d)' 'pkgconfig(libvkd3d-utils)' 'pkgconfig(vulkan)' fluidsynth-libs libstdc++ mesa-vulkan-drivers dejavu-sans-fonts pkgconf-pkg-config bubblewrap shadow-utils util-linux-core mingw64-gcc mingw64-binutils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Independently diagnose PE async APC frame SEH on Fedora
        run: make -j2 check-pe-async-special-apc-seh
      - name: Build RPM and run its check section
        run: |
          rpm_topdir="$PWD/build-rpm"
          mkdir -p "$rpm_topdir/SOURCES"
          git -c safe.directory="$PWD" archive --format=tar.gz --prefix=nt-native-linux-0.1.0/ HEAD \
            > "$rpm_topdir/SOURCES/nt-native-linux-0.1.0.tar.gz"
          rpmbuild --define "_topdir $rpm_topdir" -ba packaging/fedora/nt-native-linux.spec
          rpm -qpl "$rpm_topdir"/RPMS/x86_64/nt-native-linux-0.1.0-*.rpm > "$rpm_topdir/payload.txt"
          cat "$rpm_topdir/payload.txt"
          grep -Fx /usr/bin/nt-native-probe "$rpm_topdir/payload.txt"
          grep -Fx /usr/bin/nt-vulkan-probe "$rpm_topdir/payload.txt"
          grep -Fx /usr/bin/pe-import-audit "$rpm_topdir/payload.txt"
      - name: Install and reinstall the runtime as a Fedora user
        env:
          INSTALL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          useradd --create-home nt-installer
          for attempt in 1 2; do
            runuser -u nt-installer -- bash "$GITHUB_WORKSPACE/packaging/fedora/install.sh" "$INSTALL_REVISION"
          done
          install_home=/home/nt-installer/.local
          test "$(runuser -u nt-installer -- git -C "$install_home/share/nt-native-linux/source" rev-parse HEAD)" = "$INSTALL_REVISION"
          runuser -u nt-installer -- "$install_home/bin/nt-native-probe"
          runuser -u nt-installer -- "$install_home/bin/pe-isolated-run" --help
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          dxc="$install_home/share/nt-native-linux/current/lib/nt-native-linux/dxc/lib"
          runuser -u nt-installer -- env "VK_DRIVER_FILES=$icd" "LD_LIBRARY_PATH=$dxc" \
            make -j2 -C "$install_home/share/nt-native-linux/source" "BUILD_DIR=build-fedora-$INSTALL_REVISION" \
            check-pe-graphics check-pe-shaders check-pe-wic check-pe-platform check-pe-seh check-pe-kernel-user check-pe-nt-io check-pe-core-objects check-pe-apc check-pe-dll-graph check-pe-memory check-pe-native-core check-pe-named-events check-pe-veh check-pe-suspended-thread check-pe-async-supervisor check-pe-thread-groups check-pe-priority-class check-pe-priority-boost check-pe-process-affinity check-pe-teb-tls

      - name: Publish tested Fedora 45 RPM for download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nt-native-linux-fedora45-${{ github.sha }}
          path: build-rpm/RPMS/x86_64/*.rpm
          if-no-files-found: error
          retention-days: 14

  # A genuine Microsoft Windows kernel, on a hosted VM. This is a differential
  # reference, NOT physical hardware certification or a >64-CPU proof.
  windows-native-scheduler:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compile and run native Win32 scheduler probe with MSVC
        shell: pwsh
        run: ./scripts/windows-run-stage4-scheduler.ps1 -OutputPath build/stage4-windows-native.txt
      - name: Preserve real Windows observations (virtual runner, not physical)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-windows-native-${{ github.sha }}
          path: |
            build/stage4-windows-native.txt
            build/stage4-windows-meta.txt
            build/stage4-windows-linux-fixture.txt
            build/stage4-windows-quantum.txt
            build/stage4-windows-fp-context.txt
          if-no-files-found: error
          retention-days: 14

  # Join independent native Windows and Linux observations from THIS workflow.
  # Passing this job means reports were measured and parsed, NOT NT scheduling
  # or quantum equivalence. CPU models and host scheduler policies differ.
  scheduler-quantum-differential:
    needs: [linux, windows-native-scheduler]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download native Windows observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scheduler-windows-native-${{ github.sha }}
          path: build
      - name: Download native Linux observation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scheduler-linux-host-${{ github.sha }}
          path: build
      - name: Produce fail-closed cross-OS quantum report
        run: |
          python3 scripts/compare-stage4-quantum.py \
            --windows build/stage4-windows-quantum.txt \
            --linux build/stage4-linux-quantum.txt \
            --output build/stage4-quantum-differential.json
          grep -F 'NOT_DEMONSTRATED' build/stage4-quantum-differential.json
      - name: Preserve native Windows versus Linux guest FP context evidence
        run: |
          python3 scripts/compare-stage4-fp-context.py \
            --windows build/stage4-windows-fp-context.txt \
            --linux-log build/stage4-linux-context.log \
            --output build/stage4-context-differential.json
          grep -F '"nt_context_parity_verified": false' build/stage4-context-differential.json
      - name: Preserve quantum comparison report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduler-quantum-differential-${{ github.sha }}
          path: |
            build/stage4-quantum-differential.json
            build/stage4-context-differential.json
          if-no-files-found: error
          retention-days: 14
