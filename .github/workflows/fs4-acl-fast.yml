# SPDX-License-Identifier: MIT
name: FileSystem4 ACL fast gate

on:
  push:
    paths:
      - 'src/runtime/nt_acl_*.c'
      - 'src/runtime/nt_acl_*.h'
      - 'tests/nt_acl_*.c'
      - 'Makefile'
      - '.github/workflows/fs4-acl-fast.yml'
  pull_request:
    paths:
      - 'src/runtime/nt_acl_*.c'
      - 'src/runtime/nt_acl_*.h'
      - 'tests/nt_acl_*.c'
      - 'Makefile'
      - '.github/workflows/fs4-acl-fast.yml'

permissions:
  contents: read

jobs:
  acl-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compile and exercise canonical ACL parser, store and policy
        run: |
          set -euxo pipefail
          make -j2 check-nt-acl-engine check-nt-acl-storage check-nt-acl-policy
